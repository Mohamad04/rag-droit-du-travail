[project]
name = "rag-droit-du-travail"
version = "0.1.0"
description = "RAG from scratch on French labor law, with retrieval evaluation"
readme = "README.md"
authors = [
    { name = "Mohamad EL HAJJ", email = "mhmdhajj01@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "numpy>=2.5.4",
    "openai>=3.48.0",
    "sentence-transformers>=6.2.0",
]

[project.scripts]
rag-droit-du-travail = "rag_droit_du_travail:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
